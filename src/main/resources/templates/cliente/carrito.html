<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Shop Scribbles - Mi Carrito</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header>
    <h1>SHOP SCRIBBLES</h1>
</header>

<div class="container">
    <h2>Mi Carrito de Compras</h2>

    <div th:if="${#lists.isEmpty(items)}">
        <p>Tu carrito está vacío.</p>
        <a th:href="@{/}" class="btn">Volver al Catálogo</a>
        <a th:href="@{/checkout}" class="btn">Proceder al Pago</a>
    </div>

    <div th:if="${!#lists.isEmpty(items)}">
        <table border="1" style="width:100%; border-collapse: collapse; text-align: center;">
            <thead>
            <tr>
                <th>Producto</th>
                <th>Precio Unitario</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${items}">
                <td th:text="${item.producto.nombre}">Nombre</td>
                <td>S/ <span th:text="${#numbers.formatDecimal(item.producto.precio, 1, 2)}">0.00</span></td>
                <td>
                    <form th:action="@{/carrito/actualizar}" method="post" style="display:inline;">
                        <input type="hidden" name="id" th:value="${item.producto.id}">
                        <input type="number" name="cantidad" th:value="${item.cantidad}" min="1" th:max="${item.producto.stock}" style="width: 50px;">
                        <button type="submit" class="btn">✓</button>
                    </form>
                </td>
                <td>S/ <span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span></td>
                <td>
                    <a th:href="@{'/carrito/eliminar/' + ${item.producto.id}}" style="color: red;">Eliminar</a>
                </td>
                </tr>
            </tbody>
        </table>

        <h3 style="text-align: right; margin-top: 15px;">Total a Pagar: S/ <span th:text="${#numbers.formatDecimal(total, 1, 2)}">0.00</span></h3>

        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
            <a th:href="@{/}" class="btn" style="background-color: #7f8c8d;">Seguir Comprando</a>
            <a th:href="@{/registro}" class="btn">Proceder al Pago</a>
        </div>
    </div>
</div>

</body>
</html>
